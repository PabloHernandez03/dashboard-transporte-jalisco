<div class="pantalla">
  <form class="tarjeta" (ngSubmit)="entrar()">
    <h1>Transporte Urbano de Pasajeros</h1>
    <p class="subtitulo">Guadalajara, Jalisco</p>

    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" [(ngModel)]="usuario" autocomplete="username" required />

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required />

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Entrando...' : 'Entrar' }}
    </button>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </form>
</div>
